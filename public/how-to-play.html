<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遊び方｜ストローブリッジ・チャレンジ</title><link rel="stylesheet" href="css/styles.css"></head><body style="overflow:auto"><main style="max-width:850px;margin:auto;padding:50px 24px"><a href="/">← アプリに戻る</a><h1 style="font-size:48px;margin-top:35px">遊び方</h1><ol class="lead"><li>「事前準備」でチーム名・参加者・時間を設定します。</li><li>会場のスクリーンへ全画面表示し、「次へ」で進行します。</li><li>備品を確認し、ミッションとルールを説明します。</li><li>作戦会議と製作タイマーを開始します。</li><li>各橋の耐荷重をグラム単位で入力し、順位を表示します。</li><li>最後に振り返りの問いを使って対話します。</li></ol></main></body></html>
